name = "fotografosantodomingo-drive-pipeline"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

[triggers]
# Twice daily, Santo Domingo time (AST = UTC-4, no DST):
#   10:00 AST → 14:00 UTC   |   19:00 AST → 23:00 UTC
crons = ["0 14 * * *", "0 23 * * *"]

[vars]
SUPABASE_URL = "https://ummlavdykprwozwzhvge.supabase.co"
SITE_URL = "https://www.fotografosantodomingo.com"
WORKER_BASE_URL = "https://fotografosantodomingo-drive-pipeline.homekrypto.workers.dev"
REVIEW_EMAIL_FROM = "Babula Shots <info@fotografosantodomingo.com>"
REVIEW_EMAIL_TO = "info@fotografosantodomingo.com"
ANTHROPIC_MODEL = "claude-haiku-4-5-20251001"
META_ENABLED = "true"
META_IG_ENABLED = "true"
LINKEDIN_ENABLED = "true"
PINTEREST_ENABLED = "false"
GBP_ENABLED = "true"
DA_ENABLED = "false"

# Secrets — set each with: wrangler secret put SECRET_NAME
#
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   wrangler secret put GOOGLE_CLIENT_ID              (from GCP OAuth 2.0 credentials)
#   wrangler secret put GOOGLE_CLIENT_SECRET          (from GCP OAuth 2.0 credentials)
#   wrangler secret put GOOGLE_REFRESH_TOKEN          (visit /auth/google/start after deploy)
#   wrangler secret put GOOGLE_DRIVE_FOLDER_ID
#   wrangler secret put RESEND_API_KEY
#   wrangler secret put EMAIL_LINK_SECRET
#   wrangler secret put META_PAGE_ACCESS_TOKEN
#   wrangler secret put META_PAGE_ID
#   wrangler secret put META_IG_BUSINESS_ID
#   wrangler secret put LINKEDIN_CLIENT_ID
#   wrangler secret put LINKEDIN_CLIENT_SECRET
#   wrangler secret put LINKEDIN_ACCESS_TOKEN
#   wrangler secret put LINKEDIN_AUTHOR_URN
#   wrangler secret put PINTEREST_CLIENT_ID
#   wrangler secret put PINTEREST_CLIENT_SECRET
#   wrangler secret put PINTEREST_REFRESH_TOKEN
#   wrangler secret put PINTEREST_BOARD_ID
#   wrangler secret put GBP_CLIENT_ID
#   wrangler secret put GBP_CLIENT_SECRET
#   wrangler secret put GBP_REFRESH_TOKEN
#   wrangler secret put GBP_LOCATION_NAME
#   wrangler secret put DA_CLIENT_ID           (DeviantArt app client ID)
#   wrangler secret put DA_CLIENT_SECRET       (DeviantArt app client secret)
#   wrangler secret put DA_REFRESH_TOKEN       (visit /auth/deviantart/start after setup)
