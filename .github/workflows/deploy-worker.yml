name: Deploy Drive Pipeline Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'workers/drive-pipeline/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: workers/drive-pipeline

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: workers/drive-pipeline/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Deploy worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5a389e6eea7a4e92999c5f1612eafbcc
